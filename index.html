<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Callback Mercado Livre</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f7f4ee;
        color: #17211b;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        width: min(720px, calc(100vw - 32px));
        background: white;
        border: 1px solid #dde2dc;
        border-radius: 8px;
        padding: 28px;
        box-shadow: 0 18px 45px rgba(24, 33, 27, 0.09);
      }

      h1 {
        margin: 0 0 10px;
      }

      p {
        color: #68736c;
        line-height: 1.5;
      }

      textarea {
        width: 100%;
        min-height: 130px;
        border: 1px solid #dde2dc;
        border-radius: 6px;
        padding: 12px;
        font: 14px ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        box-sizing: border-box;
      }

      button {
        margin-top: 12px;
        margin-right: 8px;
        min-height: 42px;
        border: 0;
        border-radius: 6px;
        padding: 0 16px;
        background: #117a4f;
        color: white;
        font: inherit;
        cursor: pointer;
      }

      .status {
        margin-top: 10px;
        color: #117a4f;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Autorização recebida</h1>
      <p>Vou voltar para o ERP automaticamente. Se isso não acontecer, use os botões abaixo.</p>
      <textarea id="callbackUrl" readonly></textarea>
      <button id="openErpBtn">Voltar para o ERP</button>
      <button id="copyBtn">Copiar URL</button>
      <div class="status" id="status"></div>
    </main>
    <script>
      const callbackUrl = window.location.href;
      const erpUrl = `http://localhost:4340/?mlCallback=${encodeURIComponent(callbackUrl)}`;
      const field = document.querySelector("#callbackUrl");
      const status = document.querySelector("#status");
      field.value = callbackUrl;
      document.querySelector("#openErpBtn").addEventListener("click", () => {
        window.location.href = erpUrl;
      });
      document.querySelector("#copyBtn").addEventListener("click", async () => {
        await navigator.clipboard.writeText(callbackUrl);
        status.textContent = "URL copiada.";
      });
      window.setTimeout(() => {
        window.location.href = erpUrl;
      }, 1200);
    </script>
  </body>
</html>
